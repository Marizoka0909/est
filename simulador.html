        // Estado persistido no localStorage
        function getStore() {
            const raw = localStorage.getItem('sos_estudante_data');
            if (!raw) {
                localStorage.setItem('sos_estudante_data', JSON.stringify(INITIAL_DATA));
                return JSON.parse(JSON.stringify(INITIAL_DATA));
            }
            try { return JSON.parse(raw); } catch (e) { return JSON.parse(JSON.stringify(INITIAL_DATA)); }
        }

        function saveStore(data) {
            localStorage.setItem('sos_estudante_data', JSON.stringify(data));
        }

        function resetDemoData() {
            localStorage.setItem('sos_estudante_data', JSON.stringify(INITIAL_DATA));
            Toast.success("Dados de demonstração restaurados para o padrão original!");
            render();

        // Auditoria automática de ações
        function addAudit(operacao, recurso, recurso_id, descricao, valores_anteriores = null, valores_posteriores = null) {
            const store = getStore();
            const now = new Date();
            const timeStr = now.toISOString().replace('T', ' ').substring(0, 19);
            const newLog = {
                id: (store.auditLogs.length ? Math.max(...store.auditLogs.map(l => l.id)) + 1 : 1),
                operacao: operacao.toUpperCase(),
                recurso: recurso.toLowerCase(),
                recurso_id,
                descricao,
                valores_anteriores: valores_anteriores ? JSON.stringify(valores_anteriores, null, 2) : null,
                valores_posteriores: valores_posteriores ? JSON.stringify(valores_posteriores, null, 2) : null,
                status_resultado: "SUCESSO",
                ip_address: "127.0.0.1",
                created_at: timeStr
            };
            store.auditLogs.unshift(newLog);
            saveStore(store);
        }

        // Helpers de cálculo
        function calculateSubjectAverage(subjectId) {
            const store = getStore();
            const sGrades = store.grades.filter(g => g.disciplina_id == subjectId);
            if (!sGrades.length) return null;
            let sumP = 0, sumW = 0;
            sGrades.forEach(g => {
                const norm = (g.nota_obtida / g.nota_maxima) * 10;
                sumP += norm * g.peso;
                sumW += g.peso;
            });
            return sumW > 0 ? (sumP / sumW).toFixed(2) : null;
        }

        function calculateOverallGPA() {
            const store = getStore();
            if (!store.grades.length) return 0.0;
            let sum = 0;
            store.grades.forEach(g => {
                sum += (g.nota_obtida / g.nota_maxima) * 10;
            });
            return (sum / store.grades.length).toFixed(1);
        }

        function renderCurrentRoute() {
            switch(currentRoute) {
                case 'dashboard': return renderDashboard();
                case 'subjects': return renderSubjects();
                case 'tasks': return renderTasks();
                case 'events': return renderEvents();
                case 'grades': return renderGrades();
                case 'history': return renderHistory();
                case 'profile': return renderProfile();
                default: return renderDashboard();

        // ------------------ INTERAÇÕES E MODAIS ------------------
        function openModal(id) {
            Modal.open(id);
        }

        function toggleTaskStatus(id) {
            const store = getStore();
            const t = store.tasks.find(x => x.id === id);
            if (!t) return;
            const oldStatus = t.status;
            t.status = (t.status === 'concluida') ? 'pendente' : 'concluida';
            saveStore(store);
            addAudit('ATUALIZAR', 'tarefa', id, `Alterou status da tarefa '${t.titulo}' para ${t.status}`, { status: oldStatus }, { status: t.status });
            Toast.success(t.status === 'concluida' ? "Tarefa marcada como concluída! Parabéns!" : "Tarefa reaberta como pendente.");
            render();
        }

        function confirmDeleteTask(id) {
            const store = getStore();
            const t = store.tasks.find(x => x.id === id);
            if (!t) return;
            Modal.confirm({
                title: "Excluir Tarefa",
                message: `Deseja realmente excluir permanentemente a tarefa "${t.titulo}"?`,
                confirmText: "Sim, Excluir",
                isDanger: true,
                onConfirm: () => {
                    store.tasks = store.tasks.filter(x => x.id !== id);
                    saveStore(store);
                    addAudit('EXCLUIR', 'tarefa', id, `Excluiu a tarefa '${t.titulo}'`, t, null);
                    Toast.success("Tarefa excluída com sucesso!");
                    render();
                }
            });
        }

        function confirmDeleteSubject(id) {
            const store = getStore();
            const s = store.subjects.find(x => x.id === id);
            if (!s) return;
            Modal.confirm({
                title: "Excluir Disciplina",
                message: `Tem certeza que deseja remover a disciplina "${s.nome}"?`,
                confirmText: "Sim, Excluir",
                isDanger: true,
                onConfirm: () => {
                    store.subjects = store.subjects.filter(x => x.id !== id);
                    saveStore(store);
                    addAudit('EXCLUIR', 'disciplina', id, `Excluiu a disciplina '${s.nome}'`, s, null);
                    Toast.success("Disciplina excluída com sucesso!");
                    render();
                }
            });
        }

        function confirmDeleteEvent(id) {
            const store = getStore();
            const e = store.events.find(x => x.id === id);
            if (!e) return;
            Modal.confirm({
                title: "Remover Evento",
                message: `Tem certeza que deseja cancelar o evento "${e.titulo}"?`,
                confirmText: "Sim, Cancelar",
                isDanger: true,
                onConfirm: () => {
                    store.events = store.events.filter(x => x.id !== id);
                    saveStore(store);
                    addAudit('EXCLUIR', 'evento', id, `Cancelou o evento '${e.titulo}'`, e, null);
                    Toast.success("Evento removido da agenda!");
                    render();
                }
            });
        }

        function confirmDeleteGrade(id) {
            const store = getStore();
            const g = store.grades.find(x => x.id === id);
            if (!g) return;
            Modal.confirm({
                title: "Excluir Nota",
                message: `Deseja remover a avaliação "${g.titulo}" do boletim?`,
                confirmText: "Sim, Excluir",
                isDanger: true,
                onConfirm: () => {
                    store.grades = store.grades.filter(x => x.id !== id);
                    saveStore(store);
                    addAudit('EXCLUIR', 'nota', id, `Excluiu a nota da avaliação '${g.titulo}'`, g, null);
                    Toast.success("Nota removida do boletim!");
                    render();
                }
            });
        }

        function viewAuditDetail(log) {
            const content = `
                <div class="space-y-3">
                    <p class="text-xs text-slate-500"><strong>Data:</strong> ${log.created_at} • <strong>IP:</strong> ${log.ip_address}</p>
                    <p class="text-xs text-slate-700"><strong>Ação:</strong> ${escapeHtml(log.descricao)}</p>
                    ${log.valores_anteriores ? `<div><p class="text-[11px] font-bold uppercase text-slate-400">Valores Anteriores:</p><pre class="bg-slate-900 text-slate-200 text-xs p-3 rounded-xl overflow-x-auto font-mono mt-1">${escapeHtml(log.valores_anteriores)}</pre></div>` : ''}
                    ${log.valores_posteriores ? `<div><p class="text-[11px] font-bold uppercase text-slate-400">Valores Gravados:</p><pre class="bg-slate-900 text-slate-200 text-xs p-3 rounded-xl overflow-x-auto font-mono mt-1">${escapeHtml(log.valores_posteriores)}</pre></div>` : ''}
                </div>
            `;
            let modal = document.getElementById('audit-detail-viewer-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'audit-detail-viewer-modal';
                modal.className = 'fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm';
                modal.innerHTML = `
                    <div class="modal-backdrop fixed inset-0"></div>
                    <div class="modal-container relative bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 z-10">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-slate-800 text-base">Rastreabilidade de Auditoria</h3>
                            <button onclick="Modal.close('audit-detail-viewer-modal')" class="text-slate-400 hover:text-slate-600">✕</button>
                        </div>
                        <div id="audit-detail-body" class="mt-4"></div>
                        <div class="mt-5 pt-3 border-t border-slate-100 flex justify-end">
                            <button onclick="Modal.close('audit-detail-viewer-modal')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">Fechar</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            document.getElementById('audit-detail-body').innerHTML = content;
            Modal.open('audit-detail-viewer-modal');
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            const store = getStore();
            const old = { ...store.currentUser };
            store.currentUser.nome = document.getElementById('p_nome').value;
            store.currentUser.email = document.getElementById('p_email').value;
            store.currentUser.instituicao = document.getElementById('p_inst').value;
            store.currentUser.curso = document.getElementById('p_curso').value;
            saveStore(store);
            addAudit('ATUALIZAR', 'usuario', store.currentUser.id, "Atualizou dados do perfil", old, store.currentUser);
            Toast.success("Perfil atualizado com sucesso!");
            render();
        }

        function handleLogout() {
            Modal.confirm({
                title: "Encerrar Sessão",
                message: "Deseja realmente sair da sua conta acadêmica?",
                confirmText: "Sair",
                isDanger: false,
                onConfirm: () => {
                    addAudit('LOGOUT', 'usuario', 1, "Usuário encerrou a sessão no sistema");
                    Toast.info("Você saiu do sistema. Redirecionando para o login...");
                    setTimeout(() => {
                        navigateTo('dashboard');
                    }, 1000);
                }
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Inicializar aplicação
        document.addEventListener('DOMContentLoaded', () => {
            render();
            Toast.info("Bem-vindo ao simulador local do SOS Estudante!");
        });
    </script>

                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Disciplina</label>
                        <select id="new_e_sub" class="mt-1 block w-full px-3 py-2 border rounded-xl"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Início *</label>
                        <input id="new_e_inicio" type="datetime-local" required class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Término</label>
                        <input id="new_e_fim" type="datetime-local" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 uppercase">Local</label>
                    <input id="new_e_local" type="text" placeholder="Ex: Sala 204" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                </div>
                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" onclick="Modal.close('event-create-modal')" class="px-4 py-2 border rounded-xl text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl font-semibold">Agendar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Nova Disciplina -->
    <div id="subject-create-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-backdrop fixed inset-0"></div>
        <div class="modal-container relative bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 z-10">
            <h3 class="text-base font-bold text-slate-900 pb-3 border-b border-slate-100">Nova Disciplina</h3>
            <form onsubmit="handleCreateSubject(event)" class="mt-4 space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 uppercase">Nome da Disciplina *</label>
                    <input id="new_s_nome" type="text" required placeholder="Ex: Inteligência Artificial" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Código</label>
                        <input id="new_s_cod" type="text" placeholder="Ex: CC401" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Docente</label>
                        <input id="new_s_prof" type="text" placeholder="Ex: Prof. Roberto" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Média Mínima</label>
                        <input id="new_s_meta" type="number" step="0.1" value="7.0" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Cor</label>
                        <input id="new_s_cor" type="color" value="#6366F1" class="mt-1 block w-full h-9 border rounded-xl p-1 cursor-pointer">
                    </div>
                </div>
                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" onclick="Modal.close('subject-create-modal')" class="px-4 py-2 border rounded-xl text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl font-semibold">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Lançar Nota -->
    <div id="grade-create-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="modal-backdrop fixed inset-0"></div>
        <div class="modal-container relative bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 z-10">
            <h3 class="text-base font-bold text-slate-900 pb-3 border-b border-slate-100">Lançar Nota no Boletim</h3>
            <form onsubmit="handleCreateGrade(event)" class="mt-4 space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 uppercase">Disciplina *</label>
                    <select id="new_g_sub" required class="mt-1 block w-full px-3 py-2 border rounded-xl"></select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 uppercase">Título da Avaliação *</label>
                    <input id="new_g_titulo" type="text" required placeholder="Ex: Prova 2, Projeto Semestral" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Nota Obtida *</label>
                        <input id="new_g_nota" type="number" step="0.01" min="0" max="100" required placeholder="Ex: 8.5" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Nota Máxima</label>
                        <input id="new_g_max" type="number" step="0.01" value="10.0" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase">Peso</label>
                        <input id="new_g_peso" type="number" step="0.1" value="1.0" class="mt-1 block w-full px-3 py-2 border rounded-xl">
                    </div>
                </div>
                <div class="pt-3 flex justify-end space-x-2">
                    <button type="button" onclick="Modal.close('grade-create-modal')" class="px-4 py-2 border rounded-xl text-slate-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-xl font-semibold">Lançar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Handlers de Criação
        function handleCreateTask(e) {
            e.preventDefault();
            const store = getStore();
            const title = document.getElementById('new_t_titulo').value;
            const subId = document.getElementById('new_t_sub').value;
            const desc = document.getElementById('new_t_desc').value;
            const date = document.getElementById('new_t_date').value;
            const prio = document.getElementById('new_t_prio').value;

            const newTask = {
                id: (store.tasks.length ? Math.max(...store.tasks.map(t => t.id)) + 1 : 1),
                disciplina_id: subId ? parseInt(subId) : null,
                titulo: title,
                descricao: desc,
                data_entrega: date || null,
                prioridade: prio,
                status: 'pendente'
            };

            store.tasks.unshift(newTask);
            saveStore(store);
            addAudit('CRIAR', 'tarefa', newTask.id, `Criou a tarefa '${title}'`, null, newTask);
            Modal.close('task-create-modal');
            Toast.success(`Tarefa "${title}" adicionada com sucesso!`);
            render();
        }

        function handleCreateEvent(e) {
            e.preventDefault();
            const store = getStore();
            const title = document.getElementById('new_e_titulo').value;
            const tipo = document.getElementById('new_e_tipo').value;
            const subId = document.getElementById('new_e_sub').value;
            const inicio = document.getElementById('new_e_inicio').value;
            const fim = document.getElementById('new_e_fim').value;
            const local = document.getElementById('new_e_local').value;

            const newEvt = {
                id: (store.events.length ? Math.max(...store.events.map(ev => ev.id)) + 1 : 1),
                disciplina_id: subId ? parseInt(subId) : null,
                titulo: title,
                tipo,
                data_inicio: inicio,
                data_fim: fim || null,
                local
            };

            store.events.push(newEvt);
            saveStore(store);
            addAudit('CRIAR', 'evento', newEvt.id, `Agendou o evento '${title}' (${tipo})`, null, newEvt);
            Modal.close('event-create-modal');
            Toast.success(`Evento "${title}" agendado com sucesso!`);
            render();
        }

        function handleCreateSubject(e) {
            e.preventDefault();
            const store = getStore();
            const nome = document.getElementById('new_s_nome').value;
            const codigo = document.getElementById('new_s_cod').value;
            const prof = document.getElementById('new_s_prof').value;
            const meta = parseFloat(document.getElementById('new_s_meta').value) || 7.0;
            const cor = document.getElementById('new_s_cor').value;

            const newSub = {
                id: (store.subjects.length ? Math.max(...store.subjects.map(s => s.id)) + 1 : 1),
                nome,
                codigo,
                professor: prof,
                sala: '',
                cor,
                semestre: '2026.2',
                carga_horaria: 60,
                media_minima: meta,
                status: 'em_andamento'
            };

            store.subjects.push(newSub);
            saveStore(store);
            addAudit('CRIAR', 'disciplina', newSub.id, `Cadastrou a disciplina '${nome}'`, null, newSub);
            Modal.close('subject-create-modal');
            Toast.success(`Disciplina "${nome}" cadastrada com sucesso!`);
            render();
        }

        function handleCreateGrade(e) {
            e.preventDefault();
            const store = getStore();
            const subId = parseInt(document.getElementById('new_g_sub').value);
            const titulo = document.getElementById('new_g_titulo').value;
            const nota = parseFloat(document.getElementById('new_g_nota').value);
            const max = parseFloat(document.getElementById('new_g_max').value) || 10.0;
            const peso = parseFloat(document.getElementById('new_g_peso').value) || 1.0;

            const newGrd = {
                id: (store.grades.length ? Math.max(...store.grades.map(g => g.id)) + 1 : 1),
                disciplina_id: subId,
                titulo,
                nota_obtida: nota,
                nota_maxima: max,
                peso,
                data_avaliacao: new Date().toISOString().substring(0, 10),
                observacoes: ''
            };

            store.grades.push(newGrd);
            saveStore(store);
            addAudit('CRIAR', 'nota', newGrd.id, `Lançou a nota ${nota}/${max} em '${titulo}'`, null, newGrd);
            Modal.close('grade-create-modal');
            Toast.success(`Nota registrada com sucesso no boletim!`);
            render();
        }

        // Popula selects de disciplinas nos modais sempre que abertos
        window.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn && btn.getAttribute('onclick')) {
                const store = getStore();
                const selects = ['new_t_sub', 'new_e_sub', 'new_g_sub'];
                selects.forEach(id => {
                    const sel = document.getElementById(id);
                    if (sel) {
                        sel.innerHTML = (id === 'new_g_sub' ? '' : '<option value="">Sem disciplina vinculada</option>') + 
                            store.subjects.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');
                    }
                });
            }
        });
    </script>
</body>
</html>
